# One-click deploy on Render: New + > Blueprint > pick this repository.
services:
  - type: web
    name: padel-club
    region: frankfurt   # Europe: lowest latency for players in Spain/EU (a service's region cannot be changed after creation)
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /tmp/padel-data   # free plan has no disk: profiles reset on redeploy
